services:
  api:
    image: sysu-go-api:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-8080}
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:${PORT:-8080}"
